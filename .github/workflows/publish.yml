name: Publish to Maven Central

on:
  push:
    branches: [ main ]
    paths:
      - 'idle-detector-compose/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use version from build.gradle.kts)'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :idle-detector-compose:testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew :idle-detector-compose:lint --stacktrace

      - name: Build library
        run: ./gradlew :idle-detector-compose:assembleRelease --stacktrace

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: verify
    environment: maven-central

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode GPG Key
        env:
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
        run: |
          echo "$GPG_KEY_CONTENTS" | base64 --decode > signing-key.gpg

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :idle-detector-compose:publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Clean up GPG key
        if: always()
        run: rm -f signing-key.gpg

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP 'coordinates\("[^"]+",\s*"[^"]+",\s*"\K[^"]+' idle-detector-compose/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Installation

            Add the dependency to your `build.gradle.kts`:

            ```kotlin
            implementation("io.github.angatiabenson:idle-detector-compose:${{ steps.version.outputs.version }}")
            ```

            Or for Groovy `build.gradle`:

            ```groovy
            implementation 'io.github.angatiabenson:idle-detector-compose:${{ steps.version.outputs.version }}'
            ```

            ## What's Changed

            See the automatically generated release notes below for a full list of changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
